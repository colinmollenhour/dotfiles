[container]
symbol = "📦"
format = '[$symbol]($style) '
style = "green"

[directory]
truncate_to_repo = false
truncation_length = 5
truncation_symbol = "…/"
repo_root_style = "bold blue"

[git_branch]
truncation_length = 50

[git_commit]
disabled = false

[git_metrics]
disabled = false

[git_status]
ignore_submodules = true
format = "[$all_status$ahead_behind]($style)"
ahead = "⇡ $count "
behind = "⇣ $count "
deleted = "$count "
diverged = " ⇡${ahead_count}⇣${behind_count} "
#stashed = "✍ $count "
stashed = ""
modified = "[פֿ$count ](yellow)"
staged = '[$count ](green)'
renamed = "$count "
untracked = "✨ $count "
# Default fg, not white/bright-black: those vanish on light backgrounds.
style = "dimmed"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "dimmed"

#[custom.bash]
#command = "echo 🚀"
#when = '[ "$STARSHIP_SHELL" == "bash" ]'

